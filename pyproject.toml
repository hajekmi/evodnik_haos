[project]
name = "hacs-evodnik"
version = "0.2.2"
description = "Local eVodnik control and vendor TCP proxy for Home Assistant"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
timeout = 15

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ASYNC109", "ASYNC110"]
